<meta property="og:description" content="«Если захотят - всё увидят», говорят мне клиенты про возможности государств. Это неправда. В начале сентября в Москве прошла конференция форензики, где разработчики со сцены признавались коллегам, где их инструменты вскрывают всё, а где бессильны принципиально. Пять часов записи, пересказанные человеческим языком: что они действительно могут, чего не могут, и почему значительный участок границы контролируете вы сами.">
